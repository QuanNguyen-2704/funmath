<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Symmetry Explorer - Hover Guides</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #dcdcdc;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .app-container {
            background-color: #f5f5f5;
            border: 1px solid #aaa;
            border-radius: 8px;
            width: 900px;
            height: 580px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            display: flex;
            overflow: hidden;
        }
        /* Sidebar Menu Styles */
        .sidebar {
            background-color: #2c3e50;
            width: 200px;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            color: white;
        }
        .sidebar h3 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 18px;
            letter-spacing: 1px;
            color: #ecf0f1;
        }
        .menu-btn {
            background: none;
            border: none;
            color: #bdc3c7;
            padding: 12px 20px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }
        .menu-btn:hover {
            background-color: #34495e;
            color: white;
        }
        .menu-btn.active {
            background-color: #34495e;
            color: white;
            border-left: 4px solid #4CAF50;
            font-weight: bold;
        }
        
        /* Main Content Styles */
        .main-content {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .instructions {
            background-color: #e8f5e9;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #c8e6c9;
            margin-bottom: 20px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            color: #2e7d32;
            font-size: 14px;
            line-height: 1.5;
        }
        canvas {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            cursor: default;
        }
        .slider-container {
            margin-top: 20px;
            text-align: center;
            width: 80%;
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        input[type="range"] {
            width: 90%;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar" id="menu">
        <h3>SHAPES</h3>
        <button class="menu-btn active" data-shape="square">Square</button>
        <button class="menu-btn" data-shape="rectangle">Rectangle</button>
        <button class="menu-btn" data-shape="rhombus">Rhombus</button>
        <button class="menu-btn" data-shape="parallelogram">Parallelogram</button>
        <button class="menu-btn" data-shape="kite">Kite</button>
        <button class="menu-btn" data-shape="trapezoid">Trapezoid</button>
        <button class="menu-btn" data-shape="circle">Circle</button>
    </div>

    <div class="main-content">
        <div class="instructions">
            <strong>1.</strong> Drag the <strong>blue and red circles</strong> to set the reflection line. (Tip: Hover over the shape to reveal hidden yellow snapping dots!)<br>
            <strong>2.</strong> Use the slider to fold the shape. If it perfectly covers the other side, you found symmetry!
        </div>
        
        <canvas id="mainCanvas" width="600" height="360"></canvas>

        <div class="slider-container">
            <label for="foldSlider" style="font-weight: bold; color: #333;">Drag to fold the shape over your axis:</label>
            <input type="range" id="foldSlider" min="0" max="180" value="0">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const foldSlider = document.getElementById('foldSlider');
    const buttons = document.querySelectorAll('.menu-btn');

    let foldAngleDeg = 0;
    let currentShapeKey = 'square';
    let currentPoints = [];
    let axis = { x1: 300, y1: 50, x2: 300, y2: 310 }; 
    let dragHandle = null;
    
    // Variables to track mouse position for the hover effect
    let mouseX = -100;
    let mouseY = -100;

    // Generate circle points
    function generateCirclePoints(cx, cy, r) {
        let pts = [];
        for(let i = 0; i < 360; i += 5) {
            pts.push({x: cx + r * Math.cos(i * Math.PI / 180), y: cy + r * Math.sin(i * Math.PI / 180)});
        }
        return pts;
    }

    // Define full polygons and their recommended symmetry guide lines
    const shapesData = {
        'square': {
            points: [
                {x: 200, y: 80}, {x: 400, y: 80}, {x: 400, y: 280}, {x: 200, y: 280}
            ],
            guides: [
                {x1: 300, y1: 50, x2: 300, y2: 310}, // Vertical
                {x1: 170, y1: 180, x2: 430, y2: 180}, // Horizontal
                {x1: 170, y1: 50, x2: 430, y2: 310}, // Diagonal 1
                {x1: 430, y1: 50, x2: 170, y2: 310}  // Diagonal 2
            ]
        },
        'rectangle': {
            points: [
                {x: 150, y: 105}, {x: 450, y: 105}, {x: 450, y: 255}, {x: 150, y: 255}
            ],
            guides: [
                {x1: 300, y1: 75, x2: 300, y2: 285}, // Vertical
                {x1: 120, y1: 180, x2: 480, y2: 180} // Horizontal
            ]
        },
        'rhombus': {
            // Flattened Rhombus
            points: [
                {x: 300, y: 100}, {x: 500, y: 180}, {x: 300, y: 260}, {x: 100, y: 180}
            ],
            guides: [
                {x1: 300, y1: 70, x2: 300, y2: 290}, // Vertical
                {x1: 70, y1: 180, x2: 530, y2: 180}  // Horizontal
            ]
        },
        'parallelogram': {
            points: [
                {x: 170, y: 100}, {x: 430, y: 100}, {x: 470, y: 260}, {x: 210, y: 260}
            ],
            guides: [] // Parallelogram has NO lines of reflection symmetry
        },
        'kite': {
            points: [
                {x: 300, y: 30}, {x: 420, y: 130}, {x: 300, y: 330}, {x: 180, y: 130}
            ],
            guides: [
                {x1: 300, y1: 10, x2: 300, y2: 350} // Vertical only
            ]
        },
        'trapezoid': {
            points: [
                {x: 230, y: 100}, {x: 370, y: 100}, {x: 470, y: 280}, {x: 130, y: 280}
            ],
            guides: [
                {x1: 300, y1: 70, x2: 300, y2: 310} // Vertical only
            ]
        },
        'circle': {
            points: generateCirclePoints(300, 180, 110),
            guides: [
                {x1: 300, y1: 40, x2: 300, y2: 320}, // Vertical
                {x1: 160, y1: 180, x2: 440, y2: 180}, // Horizontal
                {x1: 200, y1: 80, x2: 400, y2: 280}, // Diagonal 1
                {x1: 400, y1: 80, x2: 200, y2: 280}  // Diagonal 2
            ]
        }
    };

    // Load initial shape
    function loadShape(shapeKey) {
        currentShapeKey = shapeKey;
        currentPoints = shapesData[shapeKey].points.map(p => ({x: p.x, y: p.y}));
        foldSlider.value = 0;
        foldAngleDeg = 0;
        axis = { x1: 300, y1: 30, x2: 300, y2: 330 }; // Default reset axis
        draw();
    }

    function getDistance(x1, y1, x2, y2) {
        return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
    }

    // --- Interactive Mouse Logic ---
    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;

        if (getDistance(mouseX, mouseY, axis.x1, axis.y1) < 15) {
            dragHandle = 'p1';
            canvas.style.cursor = 'grabbing';
        } else if (getDistance(mouseX, mouseY, axis.x2, axis.y2) < 15) {
            dragHandle = 'p2';
            canvas.style.cursor = 'grabbing';
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
        
        if (!dragHandle) {
            if (getDistance(mouseX, mouseY, axis.x1, axis.y1) < 15 || getDistance(mouseX, mouseY, axis.x2, axis.y2) < 15) {
                canvas.style.cursor = 'grab';
            } else {
                canvas.style.cursor = 'default';
            }
        } else {
            let targetX = mouseX;
            let targetY = mouseY;
            const SNAP_RADIUS = 25;

            // Check for snapping to guide points
            shapesData[currentShapeKey].guides.forEach(g => {
                if (getDistance(mouseX, mouseY, g.x1, g.y1) < SNAP_RADIUS) {
                    targetX = g.x1;
                    targetY = g.y1;
                } else if (getDistance(mouseX, mouseY, g.x2, g.y2) < SNAP_RADIUS) {
                    targetX = g.x2;
                    targetY = g.y2;
                }
            });

            if (dragHandle === 'p1') {
                axis.x1 = targetX;
                axis.y1 = targetY;
            } else if (dragHandle === 'p2') {
                axis.x2 = targetX;
                axis.y2 = targetY;
            }
        }
        
        draw(); // Redraws everything so the hover effect evaluates dynamically
    });

    canvas.addEventListener('mouseup', () => {
        dragHandle = null;
        canvas.style.cursor = 'default';
        draw();
    });

    // Clear mouse tracker when leaving canvas so dots hide
    canvas.addEventListener('mouseout', () => {
        if (!dragHandle) {
            mouseX = -100;
            mouseY = -100;
            draw();
        }
    });
    // -----------------------------

    // Menu button listeners
    buttons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            buttons.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            loadShape(e.target.getAttribute('data-shape'));
        });
    });

    foldSlider.addEventListener('input', (e) => {
        foldAngleDeg = parseInt(e.target.value);
        draw();
    });

    // --- Dynamic Polygon Splitting Math ---
    function getSide(p, A, B) {
        let val = (B.x - A.x) * (p.y - A.y) - (B.y - A.y) * (p.x - A.x);
        if (Math.abs(val) < 0.0001) return 0;
        return val;
    }

    function getIntersection(p1, p2, A, B) {
        const x1 = p1.x, y1 = p1.y, x2 = p2.x, y2 = p2.y;
        const x3 = A.x, y3 = A.y, x4 = B.x, y4 = B.y;
        const denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
        if (Math.abs(denom) < 0.0001) return null; 
        const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denom;
        return { x: x1 + t * (x2 - x1), y: y1 + t * (y2 - y1) };
    }

    function getCenter(poly) {
        if (!poly || poly.length === 0) return null;
        let sumX = 0, sumY = 0;
        for (let p of poly) { sumX += p.x; sumY += p.y; }
        return { x: sumX / poly.length, y: sumY / poly.length };
    }

    function removeDuplicates(poly) {
        if (!poly || poly.length === 0) return [];
        let res = [poly[0]];
        for (let i = 1; i < poly.length; i++) {
            let prev = res[res.length - 1];
            let curr = poly[i];
            if (Math.abs(prev.x - curr.x) > 0.01 || Math.abs(prev.y - curr.y) > 0.01) {
                res.push(curr);
            }
        }
        return res;
    }

    function splitShape(points, axis) {
        let poly1 = [];
        let poly2 = [];
        const A = {x: axis.x1, y: axis.y1};
        const B = {x: axis.x2, y: axis.y2};
        let n = points.length;

        if(n === 0) return { foldPoly: [], fixedPoly: [] };

        for (let i = 0; i < n; i++) {
            let curr = points[i];
            let next = points[(i + 1) % n];
            
            let currSide = getSide(curr, A, B);
            let nextSide = getSide(next, A, B);
            
            if (currSide >= 0) poly1.push(curr);
            if (currSide <= 0) poly2.push(curr);
            
            if ((currSide > 0 && nextSide < 0) || (currSide < 0 && nextSide > 0)) {
                let inter = getIntersection(curr, next, A, B);
                if (inter) {
                    poly1.push(inter);
                    poly2.push(inter);
                }
            }
        }

        poly1 = removeDuplicates(poly1);
        poly2 = removeDuplicates(poly2);

        let c1 = getCenter(poly1);
        let c2 = getCenter(poly2);
        
        if (c1 && c2) {
            if (Math.abs(c1.x - c2.x) < 0.1) {
                if (c1.y < c2.y) return { foldPoly: poly1, fixedPoly: poly2 };
                else return { foldPoly: poly2, fixedPoly: poly1 };
            } else if (c1.x < c2.x) {
                return { foldPoly: poly1, fixedPoly: poly2 };
            } else {
                return { foldPoly: poly2, fixedPoly: poly1 };
            }
        } else if (c1) {
            let axisCenter = {x: (A.x+B.x)/2, y: (A.y+B.y)/2}; 
            if (c1.x < axisCenter.x) return { foldPoly: poly1, fixedPoly: [] };
            else return { foldPoly: [], fixedPoly: poly1 };
        } else if (c2) {
            let axisCenter = {x: (A.x+B.x)/2, y: (A.y+B.y)/2}; 
            if (c2.x < axisCenter.x) return { foldPoly: poly2, fixedPoly: [] };
            else return { foldPoly: [], fixedPoly: poly2 };
        }
        
        return { foldPoly: [], fixedPoly: [] };
    }

    function foldPoint(p, axis, thetaDeg) {
        const theta = thetaDeg * (Math.PI / 180);
        const dx = axis.x2 - axis.x1;
        const dy = axis.y2 - axis.y1;
        const len = Math.sqrt(dx * dx + dy * dy);
        
        if (len === 0) return p;

        const ux = dx / len;
        const uy = dy / len;
        const wx = p.x - axis.x1;
        const wy = p.y - axis.y1;

        const dot = wx * ux + wy * uy;
        const projx = dot * ux;
        const projy = dot * uy;
        const perpx = wx - projx;
        const perpy = wy - projy;

        const newX = axis.x1 + projx + perpx * Math.cos(theta);
        const newY = axis.y1 + projy + perpy * Math.cos(theta);
        
        return {x: newX, y: newY};
    }

    function drawPolygon(points, fillColor, strokeColor, dash = []) {
        if (!points || points.length === 0) return;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.closePath();
        
        ctx.fillStyle = fillColor;
        ctx.fill();
        
        ctx.setLineDash(dash);
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]); 
    }

    // --- Dynamic Draw Guides (Hidden Dots) ---
    function drawGuides() {
        const guides = shapesData[currentShapeKey].guides;
        if (!guides) return;
        
        guides.forEach(g => {
            // Draw very faint dashed line
            ctx.beginPath();
            ctx.moveTo(g.x1, g.y1);
            ctx.lineTo(g.x2, g.y2);
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = 'rgba(255, 204, 0, 0.2)'; 
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Draw snapping dots ONLY if hovered near them
            drawHoverDot(g.x1, g.y1);
            drawHoverDot(g.x2, g.y2);
        });
    }

    function drawHoverDot(x, y) {
        const HOVER_RADIUS = 40;
        if (getDistance(mouseX, mouseY, x, y) < HOVER_RADIUS) {
            ctx.beginPath();
            ctx.arc(x, y, 7, 0, Math.PI * 2);
            ctx.fillStyle = '#FFC107'; // Bright Yellow
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }
    }

    function drawAxis() {
        const dx = axis.x2 - axis.x1;
        const dy = axis.y2 - axis.y1;
        
        ctx.beginPath();
        ctx.moveTo(axis.x1 - dx * 10, axis.y1 - dy * 10);
        ctx.lineTo(axis.x2 + dx * 10, axis.y2 + dy * 10);
        ctx.setLineDash([8, 8]);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.setLineDash([]);

        drawHandle(axis.x1, axis.y1, '#3498db'); // Blue
        drawHandle(axis.x2, axis.y2, '#e74c3c'); // Red
    }

    function drawHandle(x, y, color) {
        ctx.beginPath();
        ctx.arc(x, y, 8, 0, 2 * Math.PI);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Draw Guides with Hover Logic
        drawGuides();

        // 2. Split the current shape
        const parts = splitShape(currentPoints, axis);

        // 3. Draw Original Footprint (Ghost image)
        drawPolygon(currentPoints, 'transparent', 'rgba(150,150,150,0.5)', [5,5]);

        // 4. Draw the fixed polygon (the side on the right)
        drawPolygon(parts.fixedPoly, 'rgba(173, 216, 40, 0.6)', '#4CAF50');

        // 5. Calculate and Draw the folding polygon (the side on the left)
        const foldedPoints = parts.foldPoly.map(p => foldPoint(p, axis, foldAngleDeg));
        let opacity = 0.6 + (foldAngleDeg / 180) * 0.3; 
        drawPolygon(foldedPoints, `rgba(140, 190, 20, ${opacity})`, '#388E3C');

        // 6. Draw Axis handles last so they stay on top
        drawAxis();
    }

    // Initialize
    loadShape('square');
</script>
</body>
</html>
