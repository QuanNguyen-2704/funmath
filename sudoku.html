<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku - 6x6 & 9x9</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --success: #27ae60;
            --danger: #e74c3c;
            --cell-bg: #ffffff;
            --cell-readonly-bg: #e8ecf1;
            --border-color: #2c3e50; /* Bold subgrid line color */
            --grid-line: #cbd5e1;   /* Thin cell line color */
            --highlight: #b3e5fc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 30px 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            box-sizing: border-box;
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        .controls {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
            max-width: 600px;
        }

        select, button {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }

        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        /* Stats Bar (Mistakes & Messages) */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 420px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .mistake-count {
            color: var(--danger);
        }

        #message {
            text-align: right;
            min-height: 24px;
        }
        .msg-success { color: var(--success); }
        .msg-error { color: var(--danger); }

        /* Sudoku Board Layout */
        .board-container {
            margin-bottom: 40px;
        }

        .sudoku-board {
            display: grid;
            border: 3px solid var(--border-color); /* Bold outer edge */
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            overflow: hidden;
            background-color: var(--cell-bg);
        }

        .cell {
            width: 45px;
            height: 45px;
            box-sizing: border-box;
            font-size: 24px;
            text-align: center;
            background-color: var(--cell-bg);
            color: var(--secondary);
            outline: none;
            padding: 0;
            margin: 0;
            transition: background-color 0.2s, color 0.2s;
            
            /* Default thin borders for standard cells */
            border-top: none;
            border-left: none;
            border-right: 1px solid var(--grid-line);
            border-bottom: 1px solid var(--grid-line);
        }

        /* Number Highlighting */
        .cell.highlight-num {
            background-color: var(--highlight) !important;
        }

        .cell.readonly {
            background-color: var(--cell-readonly-bg);
            color: var(--primary);
            font-weight: bold;
        }

        /* Immediate Feedback Colors */
        .cell.correct {
            color: var(--success);
            font-weight: bold;
        }

        .cell.error {
            color: var(--danger);
            background-color: #fde8e8;
        }

        @media (max-width: 500px) {
            .cell { width: 35px; height: 35px; font-size: 20px; }
            .stats-bar { max-width: 330px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Sudoku Challenge</h1>
    </header>

    <div class="controls">
        <select id="size-select">
            <option value="9">9x9 Grid</option>
            <option value="6">6x6 Grid</option>
        </select>
        
        <select id="difficulty-select">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
            <option value="expert">Expert</option>
        </select>

        <button onclick="startGame()">New Game</button>
    </div>

    <div class="stats-bar">
        <div id="mistake-counter" class="mistake-count">Mistakes: 0</div>
        <div id="message"></div>
    </div>

    <div class="board-container">
        <div id="board" class="sudoku-board"></div>
    </div>

<script>
    // Sudoku Generator Class
    class SudokuGenerator {
        constructor(size, difficulty) {
            this.size = size;
            this.boxRows = size === 9 ? 3 : 2;
            this.boxCols = 3;
            
            const difficultyMap = {
                9: { easy: 30, medium: 40, hard: 50, expert: 60 },
                6: { easy: 12, medium: 16, hard: 20, expert: 24 }
            };
            this.missingCount = difficultyMap[size][difficulty];

            this.matrix = Array.from({length: size}, () => Array(size).fill(0));
            this.solution = [];
            
            this.generate();
        }

        generate() {
            for (let r = 0, c = 0; r < this.size && c < this.size; r += this.boxRows, c += this.boxCols) {
                this.fillBox(r, c);
            }
            this.solveBoard();
            this.solution = this.matrix.map(row => [...row]);
            this.removeDigits();
        }

        fillBox(rowStart, colStart) {
            let nums = [];
            for (let i = 1; i <= this.size; i++) nums.push(i);
            nums.sort(() => Math.random() - 0.5);

            let idx = 0;
            for (let i = 0; i < this.boxRows; i++) {
                for (let j = 0; j < this.boxCols; j++) {
                    this.matrix[rowStart + i][colStart + j] = nums[idx++];
                }
            }
        }

        checkSafe(row, col, num) {
            for (let x = 0; x < this.size; x++) {
                if (this.matrix[row][x] === num) return false;
            }
            for (let x = 0; x < this.size; x++) {
                if (this.matrix[x][col] === num) return false;
            }
            let startRow = row - (row % this.boxRows);
            let startCol = col - (col % this.boxCols);
            for (let i = 0; i < this.boxRows; i++) {
                for (let j = 0; j < this.boxCols; j++) {
                    if (this.matrix[i + startRow][j + startCol] === num) return false;
                }
            }
            return true;
        }

        solveBoard() {
            for (let r = 0; r < this.size; r++) {
                for (let c = 0; c < this.size; c++) {
                    if (this.matrix[r][c] === 0) {
                        for (let num = 1; num <= this.size; num++) {
                            if (this.checkSafe(r, c, num)) {
                                this.matrix[r][c] = num;
                                if (this.solveBoard()) return true;
                                this.matrix[r][c] = 0;
                            }
                        }
                        return false; 
                    }
                }
            }
            return true;
        }

        removeDigits() {
            let count = this.missingCount;
            while (count > 0) {
                let cellId = Math.floor(Math.random() * (this.size * this.size));
                let r = Math.floor(cellId / this.size);
                let c = cellId % this.size;
                if (this.matrix[r][c] !== 0) {
                    this.matrix[r][c] = 0;
                    count--;
                }
            }
        }
    }

    // Game UI State
    let currentGame = null;
    let mistakes = 0;
    const boardEl = document.getElementById('board');
    const msgEl = document.getElementById('message');
    const mistakeCounterEl = document.getElementById('mistake-counter');

    function startGame() {
        const size = parseInt(document.getElementById('size-select').value);
        const difficulty = document.getElementById('difficulty-select').value;
        
        // Reset UI & State
        mistakes = 0;
        mistakeCounterEl.textContent = `Mistakes: ${mistakes}`;
        boardEl.innerHTML = '';
        msgEl.textContent = '';
        msgEl.className = '';
        boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;

        // Generate Game
        currentGame = new SudokuGenerator(size, difficulty);

        // Render Board
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const val = currentGame.matrix[r][c];
                const input = document.createElement('input');
                input.type = 'text';
                input.inputMode = 'numeric';
                input.maxLength = 1;
                input.className = 'cell';
                input.dataset.r = r;
                input.dataset.c = c;

                // Create bold borders for subgrid dividers ONLY
                if ((c + 1) % currentGame.boxCols === 0 && c !== size - 1) {
                    input.style.borderRight = '3px solid var(--border-color)';
                } else if (c === size - 1) {
                    input.style.borderRight = 'none'; // Outer grid container handles this
                }

                if ((r + 1) % currentGame.boxRows === 0 && r !== size - 1) {
                    input.style.borderBottom = '3px solid var(--border-color)';
                } else if (r === size - 1) {
                    input.style.borderBottom = 'none'; // Outer grid container handles this
                }

                // Setup Readonly (Pre-filled) vs Empty Cells
                if (val !== 0) {
                    input.value = val;
                    input.readOnly = true;
                    input.classList.add('readonly');
                } else {
                    // Input Validation handler
                    input.addEventListener('input', function(e) {
                        this.classList.remove('error', 'correct');
                        msgEl.textContent = '';
                        
                        let enteredValue = this.value;
                        
                        // Restrict inputs to valid numbers
                        if (!/^[1-9]$/.test(enteredValue) || parseInt(enteredValue) > size) {
                            this.value = '';
                            highlightNumbers(''); // Clear highlights if erased
                            return;
                        }
                        
                        // Check if answer is correct immediately
                        const correctVal = currentGame.solution[r][c];
                        if (parseInt(enteredValue) === correctVal) {
                            this.classList.add('correct');
                            this.readOnly = true; // Lock correct answer in place
                        } else {
                            this.classList.add('error');
                            mistakes++;
                            mistakeCounterEl.textContent = `Mistakes: ${mistakes}`;
                        }
                        
                        highlightNumbers(enteredValue);
                        checkWinCondition();
                    });
                }

                // Global Focus Event: Highlights all matching numbers
                input.addEventListener('focus', function() {
                    highlightNumbers(this.value);
                });

                boardEl.appendChild(input);
            }
        }
    }

    // Function to highlight all matching numbers on the board
    function highlightNumbers(val) {
        const inputs = document.querySelectorAll('.cell');
        inputs.forEach(input => {
            input.classList.remove('highlight-num');
            // Only highlight if there is a value and it matches
            if (val !== '' && input.value === val) {
                input.classList.add('highlight-num');
            }
        });
    }

    function checkWinCondition() {
        const inputs = document.querySelectorAll('.cell');
        let isComplete = true;

        inputs.forEach(input => {
            if (input.value === '' || input.classList.contains('error')) {
                isComplete = false;
            }
        });

        if (isComplete) {
            msgEl.textContent = '🎉 You solved it!';
            msgEl.className = 'msg-success';
            
            // Lock the entire board
            inputs.forEach(input => input.readOnly = true);
        }
    }

    // Initialize first game on load
    window.onload = startGame;
</script>

</body>
</html>
