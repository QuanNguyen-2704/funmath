<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carronade Showdown | Math Adventure Hub</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A3%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root {
            --coral: #FF6B6B;   --coral-deep: #E14E56;
            --teal: #4ECDC4;    --teal-deep: #2FA79E;
            --purple: #A78BFA;  --purple-deep: #7C5CE0;
            --green: #6BCB77;   --green-deep: #48A857;
            --yellow: #FFD93D;
            --ink: #2D3142;
            --muted: #667085;
            --bg-top: #EAF6FF;
            --bg-bottom: #F5F0FF;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Quicksand', system-ui, sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--ink);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            padding: 20px;
            text-align: left;
            max-width: 900px;
        }
        .back-btn {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            color: var(--ink);
            text-decoration: none;
            background: rgba(255,255,255,0.8);
            padding: 8px 20px;
            border-radius: 999px;
            box-shadow: 0 4px 10px rgba(45,49,66,0.08);
            display: inline-flex;
            align-items: center;
            transition: transform 0.2s;
        }
        .back-btn:hover { transform: translateY(-2px); background: #fff; }

        /* Container */
        .game-container {
            background: var(--card-bg);
            max-width: 800px;
            width: 95%;
            border-radius: 40px;
            padding: 40px 30px;
            box-shadow: 0 8px 0 var(--coral-deep), 0 15px 35px rgba(45,49,66,0.1);
            text-align: center;
            position: relative;
            margin-bottom: 40px;
        }

        h1 { font-family: 'Baloo 2', sans-serif; font-size: 2.6rem; margin: 0 0 10px; line-height: 1.2; color: var(--coral-deep); }
        p.subtitle { color: var(--muted); margin-bottom: 30px; font-size: 1.1rem; }

        /* Lobby UI */
        #lobby-screen { display: block; }
        #game-screen { display: none; }

        .lobby-box {
            background: var(--bg-top);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 3px dashed var(--teal);
        }

        input.room-input {
            font-family: 'Baloo 2', sans-serif;
            font-size: 1.5rem;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid var(--muted);
            width: 150px;
            margin: 10px;
            text-transform: uppercase;
        }

        .btn {
            background: var(--teal);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 999px;
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--teal-deep);
            transition: all 0.15s;
            margin: 5px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--teal-deep); }
        .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--teal-deep); }
        .btn-coral { background: var(--coral); box-shadow: 0 4px 0 var(--coral-deep); }
        .btn-coral:hover { box-shadow: 0 6px 0 var(--coral-deep); }
        .btn-coral:active { box-shadow: 0 1px 0 var(--coral-deep); }

        /* Game Board Area */
        .board-wrapper {
            position: relative;
            width: 100%;
            height: 350px;
            background: #EAF6FF;
            border-radius: 20px;
            border: 4px solid var(--teal-deep);
            overflow: hidden;
            margin-bottom: 20px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .player-base {
            position: absolute;
            bottom: 20px;
            width: 60px;
            height: 60px;
            z-index: 5;
        }
        #base-p1 { left: 40px; }
        #base-p2 { right: 40px; transform: scaleX(-1); }

        /* Health Bars */
        .status-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        .health-bar-bg { width: 45%; background: #eee; border-radius: 10px; height: 20px; overflow: hidden; }
        .health-fill { height: 100%; background: var(--green); transition: width 0.3s; }
        #health-p1-fill { background: var(--coral); }
        #health-p2-fill { background: var(--purple); }

        /* Controls */
        .controls-panel {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-weight: 600;
        }
        input[type=range] { width: 120px; accent-color: var(--teal); }
        
        /* Custom UI Modal replacing alert() */
        #ui-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(45,49,66,0.6);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            opacity: 0; visibility: hidden;
            transition: all 0.3s;
        }
        #ui-modal.show { opacity: 1; visibility: visible; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 0 var(--teal-deep);
            max-width: 400px;
            width: 90%;
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        #ui-modal.show .modal-content { transform: translateY(0); }
        .modal-content h2 { font-family: 'Baloo 2'; color: var(--ink); margin-top: 0; }
        
        .disabled { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-btn">⬅ Back to Hub</a>
    </div>

    <main class="game-container">
        <h1>Carronade Showdown</h1>
        <p class="subtitle">Calculate your angle and power to hit your opponent!</p>

        <!-- LOBBY SCREEN -->
        <div id="lobby-screen">
            <div class="lobby-box">
                <h3>Host a Game</h3>
                <p>Create a room and share the code with a friend.</p>
                <button class="btn btn-coral" onclick="createGame()">Create Room</button>
                <h2 id="room-code-display" style="display:none; color: var(--coral-deep); letter-spacing: 2px;"></h2>
            </div>
            
            <div class="lobby-box">
                <h3>Join a Game</h3>
                <input type="text" id="join-code" class="room-input" placeholder="CODE" maxlength="4">
                <br>
                <button class="btn" onclick="joinGame()">Join Room</button>
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen">
            <div class="status-row">
                <div style="width: 45%; text-align: left;">
                    Player 1 (Host) <span id="p1-hp-text">100</span> HP
                    <div class="health-bar-bg"><div id="health-p1-fill" class="health-fill" style="width: 100%;"></div></div>
                </div>
                <div id="turn-indicator" style="font-family: 'Baloo 2'; font-size: 1.2rem; color: var(--teal-deep);">Waiting...</div>
                <div style="width: 45%; text-align: right;">
                    Player 2 (Join) <span id="p2-hp-text">100</span> HP
                    <div class="health-bar-bg"><div id="health-p2-fill" class="health-fill" style="width: 100%; float: right;"></div></div>
                </div>
            </div>

            <div class="board-wrapper">
                <canvas id="gameCanvas" width="740" height="350"></canvas>
                <!-- Player 1 Carronade SVG -->
                <svg id="base-p1" class="player-base" viewBox="0 0 100 100">
                    <rect x="20" y="60" width="60" height="30" fill="var(--coral)" rx="5"/>
                    <circle cx="35" cy="90" r="10" fill="var(--ink)"/>
                    <circle cx="65" cy="90" r="10" fill="var(--ink)"/>
                    <!-- Barrel -->
                    <rect id="barrel-p1" x="50" y="55" width="45" height="16" fill="var(--muted)" rx="8" transform="rotate(-45 50 63)"/>
                </svg>
                <!-- Player 2 Carronade SVG -->
                <svg id="base-p2" class="player-base" viewBox="0 0 100 100">
                    <rect x="20" y="60" width="60" height="30" fill="var(--purple)" rx="5"/>
                    <circle cx="35" cy="90" r="10" fill="var(--ink)"/>
                    <circle cx="65" cy="90" r="10" fill="var(--ink)"/>
                    <!-- Barrel -->
                    <rect id="barrel-p2" x="50" y="55" width="45" height="16" fill="var(--muted)" rx="8" transform="rotate(-45 50 63)"/>
                </svg>
            </div>

            <div class="controls-panel" id="controls-panel">
                <div class="slider-group">
                    <label>Angle: <span id="angle-val">45</span>°</label>
                    <input type="range" id="angle-slider" min="10" max="80" value="45">
                </div>
                <div class="slider-group">
                    <label>Power: <span id="power-val">50</span></label>
                    <input type="range" id="power-slider" min="20" max="100" value="50">
                </div>
                <button class="btn btn-coral" id="fire-btn" onclick="fireCannon()">FIRE!</button>
            </div>
        </div>
    </main>

    <!-- Custom Notification Modal -->
    <div id="ui-modal">
        <div class="modal-content">
            <h2 id="modal-title">Message</h2>
            <p id="modal-body">Details here.</p>
            <button class="btn" onclick="closeModal()">Got it!</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. FIREBASE SETUP
        // ==========================================
        // !! TEACHER QUAN: REPLACE THIS CONFIG WITH YOUR FIREBASE KEYS !!
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // ==========================================
        // 2. GAME STATE VARIABLES
        // ==========================================
        let myRole = null; // 'p1' (Host) or 'p2' (Joiner)
        let roomCode = null;
        let roomRef = null;
        let isMyTurn = false;
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let animationId;

        // UI Elements
        const angleSlider = document.getElementById('angle-slider');
        const powerSlider = document.getElementById('power-slider');
        const controlsPanel = document.getElementById('controls-panel');
        
        angleSlider.oninput = () => document.getElementById('angle-val').innerText = angleSlider.value;
        powerSlider.oninput = () => document.getElementById('power-val').innerText = powerSlider.value;

        // ==========================================
        // 3. UI NOTIFICATIONS (Replacing Alerts)
        // ==========================================
        function showModal(title, message) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = message;
            document.getElementById('ui-modal').classList.add('show');
        }
        function closeModal() {
            document.getElementById('ui-modal').classList.remove('show');
        }

        // ==========================================
        // 4. LOBBY & MULTIPLAYER LOGIC
        // ==========================================
        function generateCode() {
            return Math.floor(1000 + Math.random() * 9000).toString(); // 4 digit code
        }

        function createGame() {
            roomCode = generateCode();
            myRole = 'p1';
            roomRef = db.ref('carronade_games/' + roomCode);
            
            // Set initial state
            roomRef.set({
                state: 'waiting',
                turn: 'p1',
                p1Health: 100,
                p2Health: 100,
                lastShot: null
            });

            document.getElementById('room-code-display').style.display = 'block';
            document.getElementById('room-code-display').innerText = "Room Code: " + roomCode;
            
            listenToRoom();
        }

        function joinGame() {
            const codeInput = document.getElementById('join-code').value.trim();
            if(codeInput.length !== 4) {
                showModal("Error", "Please enter a 4-digit room code.");
                return;
            }
            roomCode = codeInput;
            myRole = 'p2';
            roomRef = db.ref('carronade_games/' + roomCode);

            roomRef.once('value', snapshot => {
                if(snapshot.exists() && snapshot.val().state === 'waiting') {
                    roomRef.update({ state: 'playing' });
                    listenToRoom();
                } else {
                    showModal("Oops!", "Room not found or game already started.");
                }
            });
        }

        function listenToRoom() {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            roomRef.on('value', snapshot => {
                const data = snapshot.val();
                if(!data) return;

                // Update Health UI
                document.getElementById('p1-hp-text').innerText = data.p1Health;
                document.getElementById('health-p1-fill').style.width = data.p1Health + '%';
                document.getElementById('p2-hp-text').innerText = data.p2Health;
                document.getElementById('health-p2-fill').style.width = data.p2Health + '%';

                // Check Game Over
                if (data.p1Health <= 0 || data.p2Health <= 0) {
                    let winner = data.p1Health > 0 ? "Player 1" : "Player 2";
                    let msg = (myRole === 'p1' && winner === "Player 1") || (myRole === 'p2' && winner === "Player 2") 
                              ? "You won the showdown! 🏆" : "You were defeated! 💥";
                    showModal("Game Over", msg);
                    controlsPanel.classList.add('disabled');
                    return;
                }

                // Handle Turns
                if (data.state === 'playing') {
                    isMyTurn = (data.turn === myRole);
                    if(isMyTurn) {
                        controlsPanel.classList.remove('disabled');
                        document.getElementById('turn-indicator').innerText = "Your Turn!";
                    } else {
                        controlsPanel.classList.add('disabled');
                        document.getElementById('turn-indicator').innerText = "Opponent's Turn...";
                    }
                }

                // Animate Opponent's Shot if it's new
                if (data.lastShot && data.lastShot.timestamp > (window.lastShotTime || 0)) {
                    window.lastShotTime = data.lastShot.timestamp;
                    if (data.lastShot.player !== myRole) {
                        animateProjectile(data.lastShot.player, data.lastShot.angle, data.lastShot.power, false);
                    }
                }
            });
        }

        // ==========================================
        // 5. GAME PHYSICS & ANIMATION
        // ==========================================
        function fireCannon() {
            if(!isMyTurn) return;

            let angle = parseInt(angleSlider.value);
            let power = parseInt(powerSlider.value);
            
            // Log the shot to Firebase
            const shotData = {
                player: myRole,
                angle: angle,
                power: power,
                timestamp: Date.now()
            };
            
            roomRef.update({ lastShot: shotData });
            animateProjectile(myRole, angle, power, true);
        }

        function animateProjectile(shooter, angleDeg, power, isLocalShooter) {
            controlsPanel.classList.add('disabled'); // Disable during animation

            // Visual adjust for SVG barrel
            let barrel = document.getElementById(shooter === 'p1' ? 'barrel-p1' : 'barrel-p2');
            barrel.setAttribute('transform', `rotate(${-angleDeg} 50 63)`);

            // Physics Setup
            let angleRad = angleDeg * (Math.PI / 180);
            let v0 = power * 0.8; // scaling factor for canvas size
            let g = 9.8; 
            
            let startX = shooter === 'p1' ? 70 : canvas.width - 70;
            let startY = canvas.height - 40;
            
            let t = 0;
            let currentX = startX;
            let currentY = startY;

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Calculate next position (Projectile Motion)
                let xDist = v0 * Math.cos(angleRad) * t;
                currentX = shooter === 'p1' ? startX + xDist : startX - xDist;
                currentY = startY - (v0 * Math.sin(angleRad) * t - 0.5 * g * t * t);
                
                // Draw Cannonball
                ctx.beginPath();
                ctx.arc(currentX, currentY, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#2D3142';
                ctx.fill();

                t += 0.2; // Time step

                // Collision Detection with Ground
                if (currentY >= canvas.height - 10) {
                    cancelAnimationFrame(animationId);
                    ctx.clearRect(0, 0, canvas.width, canvas.height); // clear ball
                    checkHit(shooter, currentX, isLocalShooter);
                } else {
                    animationId = requestAnimationFrame(draw);
                }
            }
            draw();
        }

        function checkHit(shooter, impactX, isLocalShooter) {
            // Target definitions
            let targetMin = shooter === 'p1' ? canvas.width - 100 : 20;
            let targetMax = shooter === 'p1' ? canvas.width - 20  : 100;
            
            let hit = (impactX >= targetMin && impactX <= targetMax);
            
            // Only the player who fired updates the health in the database
            if(isLocalShooter) {
                roomRef.once('value').then(snap => {
                    let data = snap.val();
                    let updates = { turn: shooter === 'p1' ? 'p2' : 'p1' };
                    
                    if (hit) {
                        if(shooter === 'p1') updates.p2Health = Math.max(0, data.p2Health - 25);
                        if(shooter === 'p2') updates.p1Health = Math.max(0, data.p1Health - 25);
                    }
                    
                    roomRef.update(updates);
                    
                    if(hit) showModal("Direct Hit!", "Great shot!");
                    else showModal("Miss!", "Adjust your math for the next turn.");
                });
            }
        }
    </script>
</body>
</html>
